<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Eagle Patch - Descargas Oficiales</title>
    <link href="https://fonts.googleapis.com/css2?family=Exo:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- POPUNDER -->
    <script data-cfasync="false" src="https://accountut.com/1/fd20108ddf4014c7acbd548996e07810"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            background-color: #000;
        }

        .slider-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 20px;
            min-height: 100vh;
            justify-content: center;
            box-sizing: border-box;
        }

        .glass-header {
            display: inline-block;
            padding: 10px 25px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 10px;
            border: 2px solid #ffd700; 
            margin-bottom: 20px;
            transition: all 0.4s ease;
        }

        .titulo-superior-descarga {
            color: #fff;
            font-family: 'Exo', sans-serif;
            font-size: clamp(1.2rem, 5vw, 2.2rem); 
            font-weight: 700;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(to bottom, #ffffff 30%, #b3b3b3 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .slider-main-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            width: 100%;
            max-width: 1150px;
        }

        .img-wrapper {
            width: 100%;
            max-width: 750px;
            aspect-ratio: 16 / 9; 
            overflow: hidden;
            border-radius: 8px;
            border: 2px solid;
            transition: all 0.4s ease;
            position: relative;
            background: #111;
        }

        .img-main {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: opacity 0.4s ease;
        }

        .nav-btn {
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid;
            color: #fff;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            outline: none;
            flex-shrink: 0;
        }

        .descarga-container {
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 12px;
            border-left: 5px solid;
            display: flex;
            flex-wrap: wrap; 
            justify-content: center;
            gap: 12px;
            margin-top: 25px;
            width: 95%;
            max-width: 700px;
            transition: border-color 0.4s ease;
        }

        .btn-descargar {
            text-decoration: none;
            padding: 12px 20px;
            border: 2px solid;
            border-radius: 5px;
            font-family: 'Exo', sans-serif;
            font-weight: 700;
            font-size: 0.85rem;
            transition: all 0.3s ease;
            background: #1a1a1a;
            white-space: nowrap;
            cursor: pointer;
        }

        /* Contenedores de Publicidad */
        .ad-lateral {
            width: 160px;
            height: 300px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ad-nativo-box {
            width: 95%;
            max-width: 700px;
            margin-top: 20px;
            background: rgba(10, 10, 10, 0.6);
            border-radius: 12px;
            padding: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #bg-dinamico {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('img/background.webp'); 
            background-size: cover;
            background-position: center;
            z-index: -2;
            filter: brightness(30%) blur(5px);
        }

        @media (max-width: 980px) {
            .ad-lateral { display: none; }
        }

        @media (max-width: 600px) {
            .slider-main-area { gap: 8px; }
            .nav-btn { width: 40px; height: 40px; font-size: 1.1rem; }
            .descarga-container { flex-direction: column; align-items: stretch; padding: 15px; }
            .btn-descargar { text-align: center; font-size: 1rem; padding: 15px; }
        }
    </style>
</head>
<body>

    <div id="bg-dinamico"></div>

    <div class="slider-container">
        <div class="glass-header" id="contenedor-titulo">
            <h1 class="titulo-superior-descarga" id="texto-titulo">EAGLE PATCH</h1>
        </div>

        <div class="slider-main-area">
            <!-- BANNER 160x300 LATERAL -->
            <div class="ad-lateral">
                <script>
                  atOptions = {
                    'key' : '031ee2eba1b152002a637ea302662bfb',
                    'format' : 'iframe',
                    'height' : 300,
                    'width' : 160,
                    'params' : {}
                  };
                </script>
                <script src="https://bellnewyork.org/22/031ee2eba1b152002a637ea302662bfb"></script>
            </div>

            <button class="nav-btn prev" id="btn-prev" onclick="cambiarVersion(-1)">&#10094;</button>
            
            <div class="img-wrapper" id="borde-imagen">
                <img id="img-patch" src="" class="img-main">
            </div>

            <button class="nav-btn next" id="btn-next" onclick="cambiarVersion(1)">&#10095;</button>
        </div>

        <div class="descarga-container" id="cuadro-info">
            <a id="link-iso" href="#" onclick="activarSmartLink(event, URL_ISO)" class="btn-descargar">DESCARGAR ISO</a>
            <a id="link-texturas" href="#" onclick="activarSmartLink(event, URL_TEXTURAS)" class="btn-descargar">TEXTURAS</a>
            <a id="link-shaders" href="#" onclick="activarSmartLink(event, URL_SHADERS)" class="btn-descargar">SHADERS</a>
        </div>

        <!-- BANNER NATIVO DEBAJO DE LOS BOTONES -->
        <div class="ad-nativo-box">
            <script async="async" data-cfasync="false" src="https://bellnewyork.org/21/3fd56beca00bc05da24c1c9df1e5d75a"></script>
            <div id="container-3fd56beca00bc05da24c1c9df1e5d75a"></div>
        </div>
    </div>

    <!-- BARRA SOCIAL -->
    <script data-cfasync="false" src="https://bellnewyork.org/14/088823f0b388f5b2fc43b877b189b6d8"></script>

    <script>
        // --- 1. CONFIGURACIÓN DE ENLACES ÚNICOS Y SMARTLINK ---
        const URL_ISO = "https://descargas.theeaglepatch.com/eaglepatch25vmxymlsfinal.cso";
        const URL_TEXTURAS = "https://www.mediafire.com/file/554166xrhw3pcj7/EAGLEMX25.zip/file";
        const URL_SHADERS = "#";
        const URL_SMARTLINK = "https://ardance.org/4/8c8952f362c31b9cabf51caddb76ca29";

        let enlaceDesbloqueado = {};

        function activarSmartLink(e, urlDescarga) {
            if (urlDescarga === "#") return;
            e.preventDefault();

            const boton = e.currentTarget;

            if (enlaceDesbloqueado[urlDescarga]) {
                window.location.href = urlDescarga;
                return;
            }

            window.open(URL_SMARTLINK, '_blank');

            let segundos = 4;
            boton.style.pointerEvents = "none";
            boton.style.opacity = "0.7";
            boton.innerText = `⏳ ESPERA ${segundos}s...`;

            const cuentaRegresiva = setInterval(() => {
                segundos--;
                if (segundos > 0) {
                    boton.innerText = `⏳ ESPERA ${segundos}s...`;
                } else {
                    clearInterval(cuentaRegresiva);
                    enlaceDesbloqueado[urlDescarga] = true;
                    
                    boton.style.pointerEvents = "auto";
                    boton.style.opacity = "1";
                    boton.style.backgroundColor = "#00ff88";
                    boton.style.color = "#000";
                    boton.style.borderColor = "#00ff88";
                    boton.innerText = "✅ LISTO - TOCA PARA DESCARGAR";
                }
            }, 1000);
        }

        // --- 2. CAPTURAS DE PANTALLA ---
        const versiones = [
            { titulo: "LIGA MX Y MLS 2024", img: "img/MXYMLS1.webp", color: "#ffd700" },
            { titulo: "LIGA MX Y MLS 2024", img: "img/MXYMLS2.webp", color: "#ffd700" },
            { titulo: "LIGA MX Y MLS 2024", img: "img/MXYMLS3.webp", color: "#ffd700" },
            { titulo: "LIGA MX Y MLS 2024", img: "img/MXYMLS4.webp", color: "#ffd700" },
            { titulo: "LIGA MX Y MLS 2024", img: "img/MXYMLS5.webp", color: "#ffd700" },
            { titulo: "LIGA MX Y MLS 2024", img: "img/MXYMLS6.webp", color: "#ffd700" },
            { titulo: "LIGA MX Y MLS 2024", img: "img/MXYMLS7.webp", color: "#ffd700" },
            { titulo: "LIGA MX Y MLS 2024", img: "img/MXYMLS8.webp", color: "#ffd700" }
        ];

        let index = 0;
        let timer;

        function actualizarPagina() {
            const v = versiones[index];
            const imgElement = document.getElementById('img-patch');
            const imgWrapper = document.getElementById('borde-imagen');
            const infoBox = document.getElementById('cuadro-info');
            const headerVidrio = document.getElementById('contenedor-titulo');
            const textoTitulo = document.getElementById('texto-titulo');
            const flechas = document.querySelectorAll('.nav-btn');
            
            const btns = {
                iso: document.getElementById('link-iso'),
                tex: document.getElementById('link-texturas'),
                sha: document.getElementById('link-shaders')
            };

            imgElement.style.opacity = 0;

            setTimeout(() => {
                imgElement.src = v.img;
                textoTitulo.innerText = "EAGLE PATCH: " + v.titulo;
                
                btns.iso.href = URL_ISO;
                btns.tex.href = URL_TEXTURAS;
                btns.sha.href = URL_SHADERS;

                headerVidrio.style.borderColor = v.color;
                imgWrapper.style.borderColor = v.color;
                imgWrapper.style.boxShadow = `0 0 40px ${v.color}44`;
                infoBox.style.borderLeftColor = v.color;

                const todosLosElementos = [...flechas, ...Object.values(btns)];
                todosLosElementos.forEach(el => {
                    if(!el) return;
                    // No sobrescribir el color verde si el botón ya fue desbloqueado
                    if(el.innerText.includes("LISTO")) return;

                    el.style.color = v.color;
                    el.style.borderColor = v.color;
                    
                    el.onmouseenter = function() {
                        if(this.innerText.includes("LISTO")) return;
                        this.style.backgroundColor = v.color;
                        this.style.color = "#000";
                        this.style.boxShadow = `0 0 20px ${v.color}`;
                    };
                    el.onmouseleave = function() {
                        if(this.innerText.includes("LISTO")) return;
                        this.style.backgroundColor = this.classList.contains('btn-descargar') ? "#1a1a1a" : "rgba(0,0,0,0.6)";
                        this.style.color = v.color;
                        this.style.boxShadow = "none";
                    };
                });
                imgElement.style.opacity = 1;
            }, 400);
        }

        function cambiarVersion(n) {
            index = (index + n + versiones.length) % versiones.length;
            actualizarPagina();
            reiniciarTimer();
        }

        function iniciarTimer() { timer = setInterval(() => cambiarVersion(1), 5000); }
        function reiniciarTimer() { clearInterval(timer); iniciarTimer(); }

        actualizarPagina();
        iniciarTimer();
    </script>
</body>
</html>
