<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Eagle Patch - Descargas Oficiales</title>
    <link href="https://fonts.googleapis.com/css2?family=Exo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            background-color: #000;
        }

        .slider-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 20px;
            min-height: 100vh;
            justify-content: center;
            box-sizing: border-box;
        }

        .glass-header {
            display: inline-block;
            padding: 10px 25px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 10px;
            border: 2px solid #ffd700; 
            margin-bottom: 20px;
            transition: all 0.4s ease;
        }

        .titulo-superior-descarga {
            color: #fff;
            font-family: 'Exo', sans-serif;
            font-size: clamp(1.2rem, 5vw, 2.2rem); 
            font-weight: 700;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(to bottom, #ffffff 30%, #b3b3b3 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .slider-main-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            width: 100%;
            max-width: 1000px;
        }

        .img-wrapper {
            width: 100%;
            max-width: 750px;
            aspect-ratio: 16 / 9; 
            overflow: hidden;
            border-radius: 8px;
            border: 2px solid;
            transition: all 0.4s ease;
            position: relative;
            background: #111;
        }

        .img-main {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: opacity 0.4s ease;
        }

        .nav-btn {
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid;
            color: #fff;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            outline: none;
            flex-shrink: 0;
        }

        .descarga-container {
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 12px;
            border-left: 5px solid;
            display: flex;
            flex-wrap: wrap; 
            justify-content: center;
            gap: 12px;
            margin-top: 25px;
            width: 95%;
            max-width: 700px;
            transition: border-color 0.4s ease;
        }

        .btn-descargar {
            text-decoration: none;
            padding: 12px 20px;
            border: 2px solid;
            border-radius: 5px;
            font-family: 'Exo', sans-serif;
            font-weight: 700;
            font-size: 0.85rem;
            transition: all 0.3s ease;
            background: #1a1a1a;
            white-space: nowrap;
        }

        #bg-dinamico {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('img/background2.webp'); 
            background-size: cover;
            background-position: center;
            z-index: -2;
            filter: brightness(30%) blur(5px);
        }

        @media (max-width: 600px) {
            .slider-main-area { gap: 8px; }
            .nav-btn { width: 40px; height: 40px; font-size: 1.1rem; }
            .descarga-container { flex-direction: column; align-items: stretch; padding: 15px; }
            .btn-descargar { text-align: center; font-size: 1rem; padding: 15px; }
        }
    </style>
</head>
<body>

    <div id="bg-dinamico"></div>

    <div class="slider-container">
        <div class="glass-header" id="contenedor-titulo">
            <h1 class="titulo-superior-descarga" id="texto-titulo">EAGLE PATCH</h1>
        </div>

        <div class="slider-main-area">
            <button class="nav-btn prev" id="btn-prev" onclick="cambiarVersion(-1)">&#10094;</button>
            
            <div class="img-wrapper" id="borde-imagen">
                <img id="img-patch" src="" class="img-main">
            </div>

            <button class="nav-btn next" id="btn-next" onclick="cambiarVersion(1)">&#10095;</button>
        </div>

        <div class="descarga-container" id="cuadro-info">
            <a id="link-iso" href="#" target="_blank" class="btn-descargar">DESCARGAR ISO</a>
            <a id="link-texturas" href="#" target="_blank" class="btn-descargar">TEXTURAS</a>
            <a id="link-shaders" href="#" target="_blank" class="btn-descargar">SHADERS</a>
        </div>
    </div>

    <script>
        // --- 1. CONFIGURACIÓN DE ENLACES ÚNICOS ---
        // Pon aquí las URLs finales que se usarán en todos los botones
        const URL_ISO = "https://descargas.theeaglepatch.com/eFootball%20COPAAMERICA%20special%20edition%20FREE.iso";
        const URL_TEXTURAS = "https://descargas.theeaglepatch.com/CAME20241.zip";
        const URL_SHADERS = "#";

        // --- 2. CAPTURAS DE PANTALLA ---
        const versiones = [
            { titulo: "COPA AMÉRICA 2024", img: "img/CA241.webp", color: "#00ff88" },
            { titulo: "COPA AMÉRICA 2024", img: "img/CA242.webp", color: "#00ff88" },
            { titulo: "COPA AMÉRICA 2024", img: "img/CA243.webp", color: "#00ff88" },
            { titulo: "COPA AMÉRICA 2024", img: "img/CA244.webp", color: "#00ff88" },
            { titulo: "COPA AMÉRICA 2024", img: "img/CA245.webp", color: "#00ff88" },
            { titulo: "COPA AMÉRICA 2024", img: "img/CA246.webp", color: "#00ff88" },
            { titulo: "COPA AMÉRICA 2024", img: "img/CA247.webp", color: "#00ff88" },
            { titulo: "COPA AMÉRICA 2024", img: "img/CA248.webp", color: "#00ff88" }
        ];

        let index = 0;
        let timer;

        function actualizarPagina() {
            const v = versiones[index];
            const imgElement = document.getElementById('img-patch');
            const imgWrapper = document.getElementById('borde-imagen');
            const infoBox = document.getElementById('cuadro-info');
            const headerVidrio = document.getElementById('contenedor-titulo');
            const textoTitulo = document.getElementById('texto-titulo');
            const flechas = document.querySelectorAll('.nav-btn');
            
            const btns = {
                iso: document.getElementById('link-iso'),
                tex: document.getElementById('link-texturas'),
                sha: document.getElementById('link-shaders')
            };

            imgElement.style.opacity = 0;

            setTimeout(() => {
                imgElement.src = v.img;
                textoTitulo.innerText = "EAGLE PATCH: " + v.titulo;
                
                // ASIGNACIÓN DE ENLACES ÚNICOS (No cambian con la imagen)
                btns.iso.href = URL_ISO;
                btns.tex.href = URL_TEXTURAS;
                btns.sha.href = URL_SHADERS;

                // Estilos visuales dinámicos
                headerVidrio.style.borderColor = v.color;
                imgWrapper.style.borderColor = v.color;
                imgWrapper.style.boxShadow = `0 0 40px ${v.color}44`;
                infoBox.style.borderLeftColor = v.color;

                const todosLosElementos = [...flechas, ...Object.values(btns)];
                todosLosElementos.forEach(el => {
                    if(!el) return;
                    el.style.color = v.color;
                    el.style.borderColor = v.color;
                    
                    el.onmouseenter = function() {
                        this.style.backgroundColor = v.color;
                        this.style.color = "#000";
                        this.style.boxShadow = `0 0 20px ${v.color}`;
                    };
                    el.onmouseleave = function() {
                        this.style.backgroundColor = this.classList.contains('btn-descargar') ? "#1a1a1a" : "rgba(0,0,0,0.6)";
                        this.style.color = v.color;
                        this.style.boxShadow = "none";
                    };
                });
                imgElement.style.opacity = 1;
            }, 400);
        }

        function cambiarVersion(n) {
            index = (index + n + versiones.length) % versiones.length;
            actualizarPagina();
            reiniciarTimer();
        }

        function iniciarTimer() { timer = setInterval(() => cambiarVersion(1), 5000); }
        function reiniciarTimer() { clearInterval(timer); iniciarTimer(); }

        actualizarPagina();
        iniciarTimer();
    </script>
</body>
</html>
